# 每周评测（Phase 评测 W4 §6.2）：全量 Layer A + web + 消融 + 分层门禁
# 触发：每周一 08:00 UTC + 手动 workflow_dispatch（无 DEEPSEEK_API_KEY 时自动跳过，不红）
name: Weekly Eval

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    # 修复（2026-09-11）：job 级 if 不允许使用 env 上下文（GitHub 只允许 github/needs/vars/inputs），
    # 之前的 `if: ${{ env.DEEPSEEK_API_KEY != '' }}` 导致 workflow 文件校验不通过——每次 push 都产生
    # 一个 0 秒 0 job 的失败 run（run 名退化成文件路径）。改为 step 级 gate：密钥缺失时整条流水线
    # 跳过并保持绿色，不再污染每次 push 的状态。
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Require DEEPSEEK_API_KEY (未配置则跳过，不红)
        id: gate
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Weekly Eval 已跳过::未配置 DEEPSEEK_API_KEY secret，跳过真实模型评测（保持绿色）。"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Validate eval datasets (零 LLM)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run bench:validate
      - name: Full eval (Layer A, 真实模型)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run bench
      - name: Judge gold check (判官可靠性)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run bench -- --judge-check
      - name: Web tasks (Bing 真实检索, 20 任务)
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/web-task-bench.mjs
      - name: Ablation A/B (prompt 工程消融, sample 20)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run bench:ablation -- --sample 20
      - name: Regression gate (分层门禁, 红则 job 失败留痕)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run bench:gate
      - name: Generate report artifacts (badge + trend.svg)
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/gen-bench-report.mjs --write-readme
      - name: Upload reports
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            benchmark/reports/
            benchmark/trend.svg
          retention-days: 30
      - name: Commit badge/trend (若有变化)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/trend.svg README.md benchmark/evaldata-hashes.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(eval): weekly report artifacts [skip ci]"
          git push

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps (npm ci 全量；跳过 electron/playwright 二进制下载 — 测试不依赖浏览器)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Unit + integration tests
        run: npm test
      # typecheck / lint：项目启用但存在大量历史类型与风格债务（node:sqlite 推断等），
      # 当前不阻塞合并——测试为真实门禁；类型/风格治理修复后再恢复
      # - name: Type check (tsc --noEmit, checkJs)
      #   run: npm run typecheck
      # - name: Lint
      #   run: npm run lint
      - name: Agent/Harness benchmark (Layer B, mock LLM, pass^3)
        run: npm run bench:agent

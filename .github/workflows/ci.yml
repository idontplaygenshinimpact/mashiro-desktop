name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps (skip electron/playwright — 测试不依赖浏览器)
        run: npm install --omit=dev
      - name: Type check (tsc --noEmit, checkJs)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests (156 cases)
        run: npm test
      - name: Agent/Harness benchmark (Layer B, mock LLM)
        run: npm run bench:agent

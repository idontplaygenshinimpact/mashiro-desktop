name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # 依赖缓存（npm ci 提速）
      - name: Install deps (npm ci 全量；跳过 electron/playwright 二进制下载 — 测试不依赖浏览器)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Unit + integration tests
        run: npm test
      - name: Dependency audit (npm audit, high+ 即失败)
        run: npm audit --audit-level=high
      - name: Coverage report (lcov → artifact)
        run: |
          mkdir -p coverage
          node --experimental-test-module-mocks --experimental-test-coverage --test "tests/*.test.mjs" --test-reporter=lcov > coverage/lcov.info 2>/dev/null || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
      - name: Type check (tsc --noEmit, checkJs)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build renderer bundle
        run: npm run build:renderer
      - name: Renderer bundle consistency (app.bundle.js 与源码一致)
        run: npm run check:renderer
      - name: Agent/Harness benchmark (Layer B, mock LLM, pass^3)
        run: npm run bench:agent

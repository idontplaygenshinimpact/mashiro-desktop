<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>mianshi-agent 看板娘</title>
<!-- CSP：同源脚本/样式；Live2D 模型/纹理走 file:（本地 node_modules，connect-src 需放行 file: 否则 XHR 加载失败桌宠白屏）；API 只允许本机 widget；script-src 需 unsafe-eval（PixiJS 运行时用 Function 构造渲染管线，否则渲染层直接 Uncaught Error 白屏） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' file:; connect-src 'self' file: http://127.0.0.1:8899 http://localhost:8899; font-src 'self' data:;">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 角色画布 -->
  <canvas id="live2d"></canvas>

  <!-- 气泡（提示消息） -->
  <div id="bubble" class="bubble hidden">
    <div class="bubble-tail"></div>
    <div id="bubble-text"></div>
  </div>

  <!-- 状态小圆点 -->
  <div id="status-dot" title="单击=真白反应，双击=打开面板，右键=完整菜单，拖动=移动"></div>

  <!-- Cubism 2.1 runtime：必须先于 bundle 加载（提供全局 Live2D 对象） -->
  <script src="lib/live2d.min.js"></script>
  <!-- Live2D 渲染（打包后的 bundle，包含 pixi + live2d 依赖） -->
  <script type="module" src="app.bundle.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>真白 · 前端秋招助手</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">🎀 真白 · 前端秋招助手</div>
    <div class="top-actions">
      <button id="voice-btn" title="语音开关">🔊</button>
      <button id="refresh-btn" title="刷新">🔄</button>
    </div>
  </header>

  <!-- Tab 导航 -->
  <nav class="tabs">
    <button class="tab active" data-tab="interview">🎤 模拟面试</button>
    <button class="tab" data-tab="review">🔁 复习</button>
    <button class="tab" data-tab="study">📋 学习清单</button>
    <button class="tab" data-tab="chat">💬 对话</button>
    <button class="tab" data-tab="crawl">🔍 爬取产出</button>
  </nav>

  <main>
    <!-- ========== 模拟面试 Tab ========== -->
    <section id="tab-interview" class="tab-panel active">
      <div class="interview-setup" id="interview-setup">
        <div class="form-row">
          <label>目标岗位</label>
          <input id="iv-position" type="text" placeholder="如：前端实习生 / React 前端" value="前端实习生" />
        </div>
        <div class="form-row">
          <label>面试官风格</label>
          <select id="iv-role">
            <option value="技术深挖型">技术深挖型</option>
            <option value="温和引导型">温和引导型</option>
            <option value="压力追问型">压力追问型</option>
          </select>
        </div>
        <div class="form-row">
          <label>重点方向（可选）</label>
          <input id="iv-focus" type="text" placeholder="如：React / 事件循环 / 简历项目" />
        </div>
        <div class="form-row">
          <label>📄 简历内容（支持上传文件或粘贴文本——面试官会基于简历追问项目经历）</label>
          <div class="resume-upload" id="resume-upload">
            <input type="file" id="iv-file" accept=".txt,.md,.json,.docx,.pdf" hidden />
            <button id="iv-file-btn" class="secondary" type="button">📂 上传简历文件</button>
            <span class="resume-file-hint" id="resume-file-hint">支持 .txt / .md / .json / .docx / .pdf</span>
          </div>
          <textarea id="iv-resume" placeholder="或直接粘贴简历文本：项目经历、实习、技能、教育背景...&#10;留空则面试官只问通用技术题"></textarea>
          <div class="resume-status" id="resume-status"></div>
        </div>
        <button id="iv-start" class="primary">🎤 开始模拟面试</button>
        <div class="iv-hint">面试会参考你的学习清单 + 最近面经 + 薄弱点出题；提供简历后优先从简历项目切入追问</div>
      </div>

      <div class="interview-session hidden" id="interview-session">
        <div class="iv-head">
          <span id="iv-status" class="iv-status">面试中 · 第 1 轮</span>
          <button id="iv-end" class="danger">结束面试</button>
        </div>
        <div class="iv-question" id="iv-question"></div>
        <div class="iv-meta" id="iv-meta"></div>
        <div class="iv-answer-area">
          <textarea id="iv-answer" placeholder="输入你的回答...（可用语音输入）"></textarea>
          <button id="iv-send" class="primary">提交回答</button>
        </div>
        <div class="iv-scores" id="iv-scores"></div>
        <div class="iv-log" id="iv-log"></div>
        <div class="iv-review hidden" id="iv-review"></div>
      </div>
    </section>

    <!-- ========== 复习 Tab ========== -->
    <section id="tab-review" class="tab-panel">
      <div class="review-stats" id="review-stats"></div>
      <div id="review-card" class="review-card hidden">
        <div id="rc-src" class="rc-src" style="display:none"></div>
        <div class="rc-topic" id="rc-topic"></div>
        <div class="rc-question" id="rc-question"></div>
        <div class="rc-answer hidden" id="rc-answer"></div>
        <button id="rc-show" class="secondary">显示答案</button>
        <div class="rc-buttons hidden" id="rc-buttons">
          <button class="rc-btn" data-rating="0">😵 忘了</button>
          <button class="rc-btn" data-rating="1">😕 困难</button>
          <button class="rc-btn" data-rating="2">🙂 记得</button>
          <button class="rc-btn" data-rating="3">😄 简单</button>
        </div>
      </div>
      <div id="review-empty" class="empty-hint">🎉 今日没有到期的复习卡片</div>
    </section>

    <!-- ========== 学习清单 Tab ========== -->
    <section id="tab-study" class="tab-panel">
      <div class="study-toolbar">
        <button id="study-gen" class="primary">✨ 从产出生成清单</button>
        <button id="study-review" class="secondary">📝 复盘验证</button>
        <button id="study-cluster-btn" class="secondary" title="勾选 2+ 个相关条目（如 MySQL底层/B+树/回表），归并成主题簇综合讲解并扩展关联考点">🔗 归并</button>
      </div>
      <div class="iv-notes-box">
        <div class="iv-notes-head">🎤 面试实录：刚被问住的知识点，一键加入必学清单</div>
        <div class="iv-notes-row">
          <input id="iv-notes-input" type="text" placeholder="如：React Hooks 原理、B树B+树区别、回表查询（逗号分隔多个）" />
          <button id="iv-notes-btn" class="primary">📌 记录</button>
        </div>
        <div id="iv-notes-result" class="iv-notes-result"></div>
      </div>
      <div id="study-list" class="study-list"></div>
      <div id="review-box" class="review-box hidden">
        <h4>复盘验证</h4>
        <div id="review-questions"></div>
        <button id="review-submit" class="primary">提交判分</button>
      </div>
    </section>

    <!-- 学习详情弹层（占面板大空间，避免小框滑动） -->
    <div id="study-detail-overlay" class="sd-overlay hidden">
      <div class="sd-modal">
        <div class="sd-modal-head">
          <b id="sd-modal-title">📖 讲解</b>
          <button id="sd-modal-close" class="sd-close" title="关闭">✕</button>
        </div>
        <div class="sd-modal-body" id="sd-modal-body">加载中...</div>
        <div class="sd-modal-ask">
          <input id="sd-ask-input" type="text" placeholder="继续追问：如「常见 Hook 有哪些？useState 和 useReducer 的区别？」" />
          <button id="sd-ask-btn" class="primary">💬 追问</button>
          <button id="sd-consolidate-btn" class="secondary" title="把原始讲解+所有追问整理成一篇结构统一的完整讲解">📚 整理</button>
        </div>
      </div>
    </div>

    <!-- ========== 对话 Tab ========== -->
    <section id="tab-chat" class="tab-panel">
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="问真白：找面经 / 讲题 / 开始模拟面试..." />
        <button id="chat-send">➤</button>
      </div>
    </section>

    <!-- ========== 爬取产出 Tab ========== -->
    <section id="tab-crawl" class="tab-panel">
      <div class="crawl-toolbar">
        <button id="crawl-run" class="primary">🔍 开始爬取</button>
        <button id="crawl-output" class="secondary">📁 打开输出目录</button>
      </div>
      <div class="crawl-progress" id="crawl-progress">暂无任务</div>
      <div class="progress-wrap hidden" id="crawl-bar-wrap"><div class="progress-bar" id="crawl-bar"></div></div>
      <div class="stats-row" id="stats-row"></div>
      <div class="today-reco hidden" id="today-reco">
        <h4>📌 今日推荐</h4>
        <div id="today-reco-body"></div>
      </div>
      <h4>📊 运行监控（LLM 调用）</h4>
      <div id="obs-row" class="obs-row"></div>
      <div id="obs-list" class="obs-list"></div>
      <h4>最近产出</h4>
      <div id="file-list" class="file-list"></div>
      <h4>面试历史</h4>
      <div id="interview-history" class="interview-history"></div>
    </section>
  </main>

  <script src="panel.js"></script>
</body>
</html>
